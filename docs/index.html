<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Bunny Runner</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body class="dark">
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1080 height=1920 tabindex="-1"></canvas>
    </div>
    <div id="loading-cover" style="display: flex;">
      <div id="unity-loading-bar">
        <div id="unity-logo"><img src="logo.png"></div>
        <div id="unity-progress-bar-empty" style="display: flex;">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div class="spinner"></div>
      </div>
    </div>
    <div id="landscape-msg" style="display: none;">
      <img id="landscape-msg-img" src="TemplateData/rotate.png" alt="">
      <p id="landscape-msg-p">Para una mejor experiencia voltea el dispositivo.</p>
    </div>
    <script>
      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/docs.loader.js";
      const config = {
        dataUrl: buildUrl + "/docs.data.unityweb",
        frameworkUrl: buildUrl + "/docs.framework.js.unityweb",
        codeUrl: buildUrl + "/docs.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Polygonus",
        productName: "Bunny Runner",
        productVersion: "1.1.0",
      };

      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const loadingCover = document.querySelector("#loading-cover");
      const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const spinner = document.querySelector('.spinner');
      const landscapeMsg = document.querySelector("#landscape-msg");
      var isMobile = 0;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
        isMobile = 1;

        window.addEventListener('resize', () => {
          getDimensions(window.innerHeight, window.innerWidth);
        });

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;

        getDimensions(window.innerHeight, window.innerWidth);
      }
      

      function getDimensions(vpheight, vpwidth){

        if(vpwidth > vpheight){
          container.style.display = "none";
          container.style.visibility = "hidden";
          loadingCover.style.display = "none";
          loadingCover.style.visibility = "hidden";
          landscapeMsg.style.display = "block";
        } else{
          container.style.display = "flex";
          container.style.visibility = "visible";
          landscapeMsg.style.display = "none";
        }
      }

      function CheckDevice()
      {
        if (typeof window.unityInstance !== 'undefined' && window.unityInstance !== null) {
            window.unityInstance.SendMessage('--Manager--', 'OnDeviceCheck', isMobile);
        } else {
            console.error("unityInstance is not defined or null");
        }
      }

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        config['webglContextAttributes'] = {
          preserveDrawingBuffer: false,
          powerPreference: 2
        };
        createUnityInstance(canvas, config, (progress) => {
          spinner.style.display = "none";
          progressBarEmpty.style.display = "";
          progressBarFull.style.width = `${100 * progress}%`;
        }).then((unityInstance) => {
          window.unityInstance = unityInstance;
          loadingCover.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
      </script>
      <script src="https://www.gstatic.com/firebasejs/9.14.0/firebase-app-compat.js"></script>
      <script src="https://www.gstatic.com/firebasejs/11.2.0/firebase-database-compat.js"></script>
      <script>
        const firebaseApp = firebase.initializeApp({
          apiKey: "AIzaSyBBs0Fyx51ef1xmFhn_9ifMzo7zr_J4Zuo",
          authDomain: "polygonus-fantarunner.firebaseapp.com",
          databaseURL: "https://polygonus-fantarunner-default-rtdb.firebaseio.com",
          projectId: "polygonus-fantarunner",
          storageBucket: "polygonus-fantarunner.firebasestorage.app",
          messagingSenderId: "181429508314",
          appId: "1:181429508314:web:1c9d7fb549f39fedcfade3"
        });
      </script>
  </body>
</html>
